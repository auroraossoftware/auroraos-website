<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="auroraGlow" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#10B981" stop-opacity="1" />
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0.9" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>
    <filter id="neonBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="1.5"/>
  <!-- Aurora Wave Path 1 -->
  <path d="M12 44 C 20 28, 28 48, 38 24 C 44 14, 50 20, 52 18" fill="none" stroke="#06B6D4" stroke-width="3" stroke-linecap="round" opacity="0.4" filter="url(#neonBlur)"/>
  <!-- Aurora Wave Path 2 -->
  <path d="M10 40 C 22 18, 30 42, 42 18 C 48 8, 54 16, 54 22" fill="none" stroke="url(#auroraGlow)" stroke-width="3.5" stroke-linecap="round" filter="url(#neonBlur)"/>
  <!-- Aurora Wave Path 3 -->
  <path d="M14 48 C 24 34, 34 50, 44 30 C 50 20, 52 26, 54 28" fill="none" stroke="#10B981" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
  <!-- OS Core Node -->
  <circle cx="32" cy="32" r="4.5" fill="#ffffff" filter="url(#neonBlur)"/>
  <circle cx="32" cy="32" r="7.5" fill="none" stroke="#34D399" stroke-width="1.5" stroke-dasharray="2 3"/>
</svg>
