<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#04060A"/>
      <stop offset="50%" stop-color="#090E17"/>
      <stop offset="100%" stop-color="#020408"/>
    </linearGradient>
    <linearGradient id="auroraGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#10B981" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0.7"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="24" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Subtle Grid -->
  <g opacity="0.06" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="105" x2="1200" y2="105"/>
    <line x1="0" y1="210" x2="1200" y2="210"/>
    <line x1="0" y1="315" x2="1200" y2="315"/>
    <line x1="0" y1="420" x2="1200" y2="420"/>
    <line x1="0" y1="525" x2="1200" y2="525"/>
    <line x1="200" y1="0" x2="200" y2="630"/>
    <line x1="400" y1="0" x2="400" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="800" y1="0" x2="800" y2="630"/>
    <line x1="1000" y1="0" x2="1000" y2="630"/>
  </g>

  <!-- Aurora Ribbon Glows in Background -->
  <path d="M-100 380 Q 250 180 600 340 T 1300 240" fill="none" stroke="#06B6D4" stroke-width="60" opacity="0.15" filter="url(#glow)"/>
  <path d="M-50 420 Q 350 210 750 400 T 1350 280" fill="none" stroke="#10B981" stroke-width="48" opacity="0.25" filter="url(#glow)"/>
  <path d="M0 450 Q 450 240 850 430 T 1400 320" fill="none" stroke="#8B5CF6" stroke-width="54" opacity="0.18" filter="url(#glow)"/>

  <!-- Aurora OS Emblem Card -->
  <g transform="translate(100, 100)">
    <rect width="72" height="72" rx="18" fill="#0D1526" stroke="#1E293B" stroke-width="2"/>
    <path d="M18 48 C 28 26, 36 50, 48 24 C 54 14, 60 20, 62 18" fill="none" stroke="url(#auroraGrad1)" stroke-width="4" stroke-linecap="round"/>
    <circle cx="36" cy="36" r="5" fill="#FFFFFF"/>
    <circle cx="36" cy="36" r="9" fill="none" stroke="#34D399" stroke-width="2" stroke-dasharray="2 3"/>
  </g>

  <!-- Badge -->
  <g transform="translate(190, 118)">
    <rect width="280" height="36" rx="18" fill="rgba(16, 185, 129, 0.12)" stroke="rgba(16, 185, 129, 0.3)" stroke-width="1.5"/>
    <text x="24" y="23" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#34D399" letter-spacing="1">EXPERIMENTAL LINUX PLATFORM</text>
  </g>

  <!-- Titles -->
  <text x="100" y="250" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="64" font-weight="800" fill="#FFFFFF" letter-spacing="-1">Aurora OS</text>
  <text x="100" y="315" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="32" font-weight="600" fill="#38BDF8">The AI-Native Operating System for Linux</text>

  <!-- Description -->
  <text x="100" y="380" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="400" fill="#94A3B8">
    Making AI a shared, secure, first-class system service — not an application afterthought.
  </text>
  <text x="100" y="414" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="400" fill="#64748B">
    Zero ambient authority • Microsecond IPC dispatch • Verifiable local privacy.
  </text>

  <!-- Metrics Bar -->
  <g transform="translate(100, 480)">
    <!-- Metric 1 -->
    <rect width="210" height="80" rx="14" fill="rgba(15, 23, 42, 0.7)" stroke="rgba(255, 255, 255, 0.08)"/>
    <text x="20" y="36" font-family="'JetBrains Mono', monospace" font-size="24" font-weight="700" fill="#34D399">0.061 ms</text>
    <text x="20" y="60" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="500" fill="#94A3B8">Median IPC Overhead</text>

    <!-- Metric 2 -->
    <rect x="230" width="210" height="80" rx="14" fill="rgba(15, 23, 42, 0.7)" stroke="rgba(255, 255, 255, 0.08)"/>
    <text x="250" y="36" font-family="'JetBrains Mono', monospace" font-size="24" font-weight="700" fill="#38BDF8">2.8 MiB</text>
    <text x="250" y="60" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="500" fill="#94A3B8">Daemon Memory RSS</text>

    <!-- Metric 3 -->
    <rect x="460" width="210" height="80" rx="14" fill="rgba(15, 23, 42, 0.7)" stroke="rgba(255, 255, 255, 0.08)"/>
    <text x="480" y="36" font-family="'JetBrains Mono', monospace" font-size="24" font-weight="700" fill="#C084FC">211 Passed</text>
    <text x="480" y="60" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="500" fill="#94A3B8">Automated Tests</text>

    <!-- Metric 4 -->
    <rect x="690" width="310" height="80" rx="14" fill="rgba(15, 23, 42, 0.7)" stroke="rgba(255, 255, 255, 0.08)"/>
    <text x="710" y="36" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="20" font-weight="700" fill="#FFFFFF">github.com/auroraossoftware</text>
    <text x="710" y="60" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="500" fill="#10B981">Free &amp; Open Source (MIT)</text>
  </g>
</svg>
